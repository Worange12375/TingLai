<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>听籁 SoundVerse</title>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#7C9473" />

  <!-- 声波弧（两道，米白粗线） -->
  <g fill="none" stroke="#FBF7EE" stroke-width="4" stroke-linecap="round">
    <path d="M44 14 C58 16 66 34 60 50 C54 62 38 64 24 58" />
    <path d="M40 22 C50 24 54 36 49 46 C44 54 34 56 27 52" />
  </g>

  <!-- 放大镜（简化） -->
  <circle cx="22" cy="44" r="9" fill="none" stroke="#FBF7EE" stroke-width="3.5" />
  <line x1="15" y1="51" x2="7" y2="58" stroke="#FBF7EE" stroke-width="3.5" stroke-linecap="round" />

  <!-- 小鸟（蜜桃色填充 · 鸟头朝右翻转） -->
  <g transform="translate(44, 0) scale(-1, 1)">
    <path
      fill="#E8A87C"
      d="M13 40 C10 35 12 28 18 25 C23 23 28 24 31 27 L36 23 L31 29 C33 33 30 38 26 42 C22 45 16 44 13 40 Z"
    />
