<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>听籁 SoundVerse</title>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#7C9473" />

  <!-- 声波弧（两道，米白粗线 · 向右上扩散） -->
  <g fill="none" stroke="#FBF7EE" stroke-width="4" stroke-linecap="round">
    <path d="M42 12 C56 14 62 30 58 46 C54 58 40 62 28 56" />
    <path d="M38 20 C48 22 52 34 49 46 C46 54 36 57 28 53" />
  </g>

  <!-- 放大镜（米白 · 鸟站立其上的基座） -->
  <circle cx="22" cy="46" r="9" fill="none" stroke="#FBF7EE" stroke-width="3.5" />
  <line x1="15" y1="53" x2="8" y2="60" stroke="#FBF7EE" stroke-width="3.5" stroke-linecap="round" />

  <!-- 小鸟（蜜桃色圆胖剪影 · 朝右上鸣唱 + 冠羽） -->
  <path
    fill="#E8A87C"
    d="M13 40 C10 35 12 28 18 25 C23 23 28 24 31 27 L36 23 L31 29 C33 33 30 38 26 42 C22 45 16 44 13 40 Z"
  />
  <!-- 冠羽 -->
  <g fill="none" stroke="#FBF7EE" stroke-width="1.6" stroke-linecap="round">
    <path d="M29 24 C28 20 29 17 31 15" />
    <path d="M32 25 C32 21 34 19 36 17" />
  </g>
  <!-- 眼睛 -->
  <circle cx="21" cy="30" r="1.8" fill="#3E342B" />
</svg>
